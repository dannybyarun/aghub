name: aghub real-project swarm (account B)

# This repository exists only to provide a second account's GitHub-hosted
# runners. Every job checks out the canonical board repository on account A and
# pushes back to it through CROSS_REPO_TOKEN.

on:
  workflow_dispatch:
    inputs:
      hub_url:
        description: Public URL of the aghub hub
        required: true
        type: string
      hub_token:
        description: Hub token scoped to this project
        required: true
        type: string
      project:
        description: Board project name
        required: true
        default: swarm-real
        type: string

permissions:
  contents: read

concurrency:
  group: aghub-real-swarm-b
  cancel-in-progress: false

jobs:
  machine:
    name: ${{ matrix.agent }} (${{ matrix.runner }}) [account B]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - agent: b1
            lane: T-006
            ghost: "1"
            runner: ubuntu-22.04
          - agent: b2
            lane: T-007
            ghost: "0"
            runner: ubuntu-24.04
          - agent: b3
            lane: T-008
            ghost: "0"
            runner: ubuntu-22.04
          - agent: b4
            lane: T-009
            ghost: "0"
            runner: ubuntu-24.04
          - agent: b5
            lane: T-010
            ghost: "0"
            runner: ubuntu-22.04

    steps:
      - name: Check out the canonical board repository (account A)
        uses: actions/checkout@v4
        with:
          repository: YOUR-ORG/aghub-swarm-live
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install aghub's only dependency and put its launcher on PATH
        run: |
          python -m pip install --quiet PyYAML
          chmod +x bin/aghub
          chmod +x swarm/agent.sh swarm/check.sh
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Join the board and run this machine's lane
        env:
          AGENT_NAME: ${{ matrix.agent }}
          ROLE: follower
          LANE: ${{ matrix.lane }}
          GHOST: ${{ matrix.ghost }}
          HUB_URL: ${{ inputs.hub_url }}
          HUB_TOKEN: ${{ inputs.hub_token }}
          PROJECT: ${{ inputs.project }}
        run: bash swarm/agent.sh

      - name: Show the final board
        if: always()
        run: |
          aghub status || true
          git log --oneline -15 origin/main || true
          node app/tests/run-tests.js || true
          node app/tests/run-lanes.js || true
